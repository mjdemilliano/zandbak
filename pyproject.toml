[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zandbak"
version = "0.2.0"
description = "Run developer tools and AI coding agents inside a bubblewrap sandbox"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.15",
  "mypy>=1.15"
]

[project.scripts]
zandbak = "zandbak.cli:main"

[tool.setuptools.package-data]
zandbak = ["defaults.toml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs the real bwrap binary"]
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # trailing commas: conflicts with the formatter
  "EM101", "EM102", "TRY003",  # inline exception messages read better here
  "S603",  # subprocess with a list argv: that is the safe form, never a shell
  "CPY001",  # the license is in LICENSE, not repeated in every file
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/zandbak/cli.py" = ["T201"]  # a CLI prints
"tests/**" = [
  "S101",  # pytest uses assert
  "PLR2004",  # magic values are the point of a test
  "ANN",  # tests are type-checked loosely (see mypy overrides)
  "D",  # test names document themselves
  "SLF001",  # tests may look at private helpers
  "S108",  # /tmp paths in fixtures
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_calls = false
