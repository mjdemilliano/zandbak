[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devenv"
version = "0.1.0"
description = "Run development tools and AI coding agents inside a bubblewrap sandbox"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
devenv = "devenv.cli:main"

[tool.setuptools.package-data]
devenv = ["defaults.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs the real bwrap binary"]
