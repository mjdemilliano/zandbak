# devenv default configuration.
#
# Copy it with `devenv --dump-config > ~/.config/devenv/config.toml` and edit.
# Any key you set replaces the default value for that key (lists are not
# merged), so copy the full list when you only want to add one entry.

# bwrap binary (looked up on PATH if not absolute).
bwrap_path = "bwrap"

# Command run inside the sandbox when none is given on the command line.
command = ["bash"]

# Share the host network. Agents need it to reach their APIs.
# `devenv --no-network` turns it off for one run.
network = true

# Extra arguments passed to bwrap verbatim, one argument per list element.
# They are applied before devenv's own protections, so they cannot undo them.
bwrap_extra_args = []

# Host environment variables passed into the sandbox. Everything else is
# cleared.
env_allow = [
  "TERM", "COLORTERM", "LANG", "LC_ALL", "LC_MESSAGES", "LC_CTYPE",
  "HOME", "USER", "LOGNAME", "PATH", "EDITOR",
  "ANTHROPIC_API_KEY", "ANTHROPIC_MODEL",
  "ANTHROPIC_DEFAULT_OPUS_MODEL", "ANTHROPIC_DEFAULT_SONNET_MODEL",
  "ANTHROPIC_DEFAULT_HAIKU_MODEL",
  "CLAUDE_CODE_USE_VERTEX", "CLOUD_ML_REGION", "ANTHROPIC_VERTEX_PROJECT_ID",
  "GEMINI_API_KEY", "GOOGLE_API_KEY", "GCLOUD_PROJECT", "GOOGLE_CLOUD_PROJECT",
  "GOOSE_PROVIDER", "GOOSE_MODEL", "GOOSE_PLANNER_PROVIDER", "GOOSE_PLANNER_MODEL",
  "OPENAI_API_KEY", "OPENAI_API_BASE", "OPENROUTER_API_KEY",
]

[home]
# The sandbox's home directory starts empty (a tmpfs). Only the paths below,
# relative to $HOME, are mounted from the host. Missing paths are skipped.

# Read-only.
ro = [".gitconfig", ".config/git"]

# Read-write: changes persist on the host.
rw = [
  ".claude",
  ".gemini",
  ".config/goose",
  ".local/share/goose",
  ".local/state/goose",
]

# Private copy: the sandbox gets a writable copy of the file; changes are
# discarded when the session ends. Used for files an agent rewrites
# constantly but that can also define commands run on the host
# (~/.claude.json holds MCP server definitions).
ephemeral = [".claude.json"]

# Paths inside the writable areas above that are mounted read-only, because
# their contents run on the host later (hooks, MCP servers, plugins).
# A protected path that does not exist yet is watched instead: if the agent
# creates it, devenv renames it to *.devenv-quarantine-<time> after the session.
protect = [
  ".claude/settings.json",
  ".claude/settings.local.json",
  ".claude/hooks",
  ".claude/plugins",
  ".claude/commands",
  ".claude/agents",
  ".claude/skills",
  ".gemini/settings.json",
  ".gemini/extensions",
  ".gemini/commands",
  ".config/goose/config.yaml",
]

[project]
# Paths relative to the project directory (where you run devenv) that are
# protected the same way. These are files that run code on the host
# without you explicitly running project code.
# `devenv --allow-git-writes` drops the .git entries for one run.
protect = [
  ".git/config",
  ".git/hooks",
  ".git/modules",  # submodule configs/hooks; the agent can't commit inside submodules
  ".claude/settings.json",
  ".claude/settings.local.json",
  ".mcp.json",
  ".gemini/settings.json",
  ".envrc",
  ".vscode",
]
